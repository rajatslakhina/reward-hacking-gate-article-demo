name: Visuals

on:
  push:
    branches: [main]
    paths:
      - 'docs/src/**'
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: visuals
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-inter imagemagick
      - name: Render article visuals from docs/src
        run: |
          render () {
            google-chrome --headless=new --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --window-size="$2,$(( $3 + 200 ))" \
              --screenshot="/tmp/$1.png" "file://$PWD/docs/src/$1.html"
            convert "/tmp/$1.png" -crop "$2x$3+0+0" +repage "docs/$1.png"
          }
          render header 1600 840
          render diagram 1600 940
          render code 1200 628
          render simulator 1600 1000
          ls -la docs
      - name: Commit visuals if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Render article visuals [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
